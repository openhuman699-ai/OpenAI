<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenAI Chat</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #080b12;
        color: #f5f7fb;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at 20% 0%, rgba(69, 113, 255, .18), transparent 34rem),
          radial-gradient(circle at 90% 90%, rgba(123, 66, 246, .16), transparent 30rem),
          #080b12;
      }
      main { width: min(900px, 100%); min-height: 100vh; margin: 0 auto; padding: 28px 20px; display: flex; flex-direction: column; }
      header { display: flex; justify-content: space-between; align-items: center; gap: 18px; margin-bottom: 28px; }
      .brand { display: flex; align-items: center; gap: 12px; font-weight: 750; letter-spacing: -.02em; }
      .mark { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 12px; background: linear-gradient(135deg, #7294ff, #9459ff); box-shadow: 0 8px 30px rgba(114, 148, 255, .25); }
      .status { color: #9ca7b9; font-size: 13px; }
      .status::before { content: ""; display: inline-block; width: 7px; height: 7px; margin-right: 7px; border-radius: 50%; background: #45d596; box-shadow: 0 0 12px #45d596; }
      #messages { flex: 1; display: flex; flex-direction: column; gap: 16px; padding: 18px 0 26px; }
      .hero { margin: auto; max-width: 620px; padding: 64px 0; text-align: center; }
      .hero h1 { margin: 0 0 12px; font-size: clamp(34px, 7vw, 58px); line-height: 1; letter-spacing: -.055em; }
      .hero p { margin: 0; color: #9ca7b9; font-size: 17px; line-height: 1.6; }
      .message { max-width: 78%; padding: 14px 17px; border-radius: 18px; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; }
      .user { align-self: flex-end; background: #516fe8; border-bottom-right-radius: 6px; }
      .assistant { align-self: flex-start; background: #171c27; border: 1px solid #262d3a; border-bottom-left-radius: 6px; }
      form { position: sticky; bottom: 20px; display: flex; align-items: flex-end; gap: 10px; padding: 10px; border: 1px solid #293142; border-radius: 20px; background: rgba(19, 24, 34, .88); box-shadow: 0 20px 60px rgba(0, 0, 0, .35); backdrop-filter: blur(18px); }
      textarea { flex: 1; min-height: 46px; max-height: 160px; resize: none; padding: 12px; border: 0; outline: 0; background: transparent; color: inherit; font: inherit; line-height: 1.4; }
      textarea::placeholder { color: #747f91; }
      button { width: 46px; height: 46px; border: 0; border-radius: 14px; background: linear-gradient(135deg, #6f8cff, #925cff); color: white; font-size: 20px; cursor: pointer; transition: transform .15s, opacity .15s; }
      button:hover { transform: translateY(-1px); }
      button:disabled { cursor: wait; opacity: .5; transform: none; }
      .hint { margin: 10px 0 0; color: #667185; text-align: center; font-size: 12px; }
      @media (max-width: 600px) { main { padding: 18px 14px; } .message { max-width: 90%; } .status { display: none; } }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div class="brand"><span class="mark">✦</span><span>OpenAI Chat</span></div>
        <div class="status" id="status">API готов</div>
      </header>
      <section id="messages" aria-live="polite">
        <div class="hero" id="hero">
          <h1>Чем могу помочь?</h1>
          <p>Минималистичный чат на FastAPI с безопасной серверной интеграцией OpenAI.</p>
        </div>
      </section>
      <form id="chat-form">
        <textarea id="prompt" rows="1" maxlength="20000" placeholder="Напишите сообщение…" aria-label="Сообщение" required></textarea>
        <button id="send" type="submit" aria-label="Отправить">↑</button>
      </form>
      <p class="hint">Enter — отправить · Shift+Enter — новая строка</p>
    </main>
    <script>
      const form = document.querySelector("#chat-form");
      const prompt = document.querySelector("#prompt");
      const send = document.querySelector("#send");
      const messages = document.querySelector("#messages");
      const status = document.querySelector("#status");
      const history = [];

      function addMessage(role, content) {
        document.querySelector("#hero")?.remove();
        const node = document.createElement("div");
        node.className = `message ${role}`;
        node.textContent = content;
        messages.append(node);
        node.scrollIntoView({ behavior: "smooth", block: "end" });
      }

      prompt.addEventListener("input", () => {
        prompt.style.height = "auto";
        prompt.style.height = `${Math.min(prompt.scrollHeight, 160)}px`;
      });
      prompt.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();
          form.requestSubmit();
        }
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const content = prompt.value.trim();
        if (!content) return;
        history.push({ role: "user", content });
        addMessage("user", content);
        prompt.value = "";
        prompt.style.height = "auto";
        send.disabled = true;
        status.textContent = "Модель отвечает…";
        try {
          const response = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ messages: history }),
          });
          const body = await response.json();
          if (!response.ok) throw new Error(body.detail || "Не удалось получить ответ");
          history.push(body.message);
          addMessage("assistant", body.message.content);
          status.textContent = body.model;
        } catch (error) {
          addMessage("assistant", `Ошибка: ${error.message}`);
          status.textContent = "Проверьте конфигурацию";
        } finally {
          send.disabled = false;
          prompt.focus();
        }
      });
    </script>
  </body>
</html>
